services:
  api:
    build: ./backend
    ports:
      - "8016:8016"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend:/app

  web:
    build: ./frontend
    ports:
      - "3016:3016"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:8016

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:
